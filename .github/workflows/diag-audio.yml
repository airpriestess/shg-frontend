name: Diagnose audio
on:
  push:
    branches: [diag-audio]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Live site version
        run: |
          curl -s https://reshmaoracle.com/shop | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1
          js=$(curl -s https://reshmaoracle.com/ | grep -o '/assets/index-[A-Za-z0-9_-]*\.js' | head -1); echo "$js"
          curl -s "https://reshmaoracle.com$js" | grep -o 'beacons.ai/reshmaoracle")' | head -1 || true
          curl -s "https://reshmaoracle.com$js" | grep -c 'shg-splash-line' || true
